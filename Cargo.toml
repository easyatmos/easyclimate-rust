[package]
name = "easyclimate_rust"
version = "2026.10.0"
edition = "2024"

[lib]
name = "easyclimate_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3" }
rayon = "1.12"
numpy = "0.29"
ndarray = "0.17.2"
nalgebra = "0.35"
num-complex = "0.4.6"
rustfft = "6.4.1"

[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
# Rust tests embed Python; extension wheels use the importing interpreter.
pyo3 = { version = "0.29.3", features = ["auto-initialize"] }
criterion = "0.8.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 1
debug = true
incremental = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
incremental = false
overflow-checks = false
